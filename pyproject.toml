[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oriongeno"
description = "OrionGeno: ab initio eukaryotic gene annotation from genome sequence"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-OrionGeno-NonCommercial"
license-files = ["LICENSE"]
dynamic = ["version"]
dependencies = [
    "numpy>=2.2,<3",
    "biopython>=1.85",
    "einops>=0.8",
    "typing_extensions>=4.12",
    "transformers>=4.57,<5",
    "tokenizers>=0.22,<0.23",
    "huggingface_hub>=0.34",
    "safetensors>=0.5",
    "tqdm>=4.66",
]

[project.scripts]
oriongeno = "oriongeno.cli:main"

[project.optional-dependencies]
performance = ["numba==0.65.1"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.14,<0.15"]

[tool.setuptools.dynamic]
version = { attr = "oriongeno.__version__" }

[tool.setuptools.packages.find]
include = ["oriongeno*"]

[tool.setuptools.package-data]
"oriongeno.model_packages" = ["*.pkl"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: annotation roundtrip and production assembly regressions"]
